[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "long-gate"
version = "0.2.0"
description = "Local-first privacy gateway and capability boundary for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "CochraneK"}]
keywords = [
  "privacy",
  "ai-security",
  "ai-agents",
  "synthetic-data",
  "pii",
  "mcp",
  "local-first",
  "data-governance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "faker>=30.0",
]

[project.urls]
Homepage = "https://github.com/CochraneK/long-gate"
Documentation = "https://github.com/CochraneK/long-gate/blob/main/docs/index.md"
Repository = "https://github.com/CochraneK/long-gate"
Issues = "https://github.com/CochraneK/long-gate/issues"
Changelog = "https://github.com/CochraneK/long-gate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
parquet = ["pyarrow>=16"]
synthcity = ["synthcity>=0.2.12"]
mostlyai = ["mostlyai[local]"]
stats = ["statsmodels>=0.14"]
presidio = ["presidio-analyzer>=2.2"]
mcp = ["fastmcp>=3.2,<4"]\ndocuments = ["python-docx>=1.1", "pypdf>=5"]
dev = ["pytest>=8.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
longgate = "longgate.cli:main"
longgate-mcp = "longgate.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/longgate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
