name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c constraints-ci.txt -e '.[dev,attestation]'
      - run: pytest -q
      - run: ruff check src tests research tools
      - name: Rebuild bilingual README
        run: |
          python tools/build_readme.py
          git diff --exit-code -- README.md README.en.md README.zh-CN.md
      - name: Exercise README asset generator
        run: python tools/build_readme_assets.py
      - name: Audit project continuity
        run: python tools/audit_project_continuity.py
      - run: python -m research.check_artifact
