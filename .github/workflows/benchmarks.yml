name: benchmark-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-privacy-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Long Gate
        run: python -m pip install -e .
      - name: Generate synthetic benchmark fixture
        run: python benchmarks/generate_adversarial.py
      - name: Run structured audit benchmark
        run: python benchmarks/run_privacy_benchmark.py > benchmark-privacy.json
      - name: Run k-anonymity-style benchmark
        run: python benchmarks/run_k_anonymity_benchmark.py > benchmark-k.json
      - name: Run membership diagnostic
        run: python benchmarks/run_membership_benchmark.py > benchmark-membership.json
      - name: Run auxiliary linkage diagnostic
        run: python benchmarks/run_linkage_benchmark.py > benchmark-linkage.json
      - name: Confirm machine-readable output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").glob("benchmark-*.json")):
              data = json.loads(path.read_text())
              assert "benchmark" in data
              print(path, data["benchmark"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: long-gate-synthetic-benchmark-results
          path: benchmark-*.json
