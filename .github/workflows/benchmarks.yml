name: benchmark-smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-privacy-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Long Gate
        run: python -m pip install -c constraints-ci.txt -e .
      - name: Generate synthetic benchmark fixture
        run: python benchmarks/generate_adversarial.py
      - name: Run structured audit benchmark
        run: python benchmarks/run_privacy_benchmark.py > benchmark-privacy.json
      - name: Run k-anonymity-style benchmark
        run: python benchmarks/run_k_anonymity_benchmark.py > benchmark-k.json
      - name: Run membership diagnostic
        run: python benchmarks/run_membership_benchmark.py > benchmark-membership.json
      - name: Run ensemble membership diagnostic
        run: python benchmarks/run_ensemble_membership_benchmark.py > benchmark-membership-ensemble.json
      - name: Run auxiliary linkage diagnostic
        run: python benchmarks/run_linkage_benchmark.py > benchmark-linkage.json
      - name: Run attribute inference diagnostic
        run: python benchmarks/run_attribute_benchmark.py > benchmark-attribute.json
      - name: Run longitudinal linkage diagnostic
        run: python benchmarks/run_longitudinal_benchmark.py > benchmark-longitudinal.json
      - name: Run fuzzy longitudinal linkage diagnostic
        run: python benchmarks/run_fuzzy_longitudinal_benchmark.py > benchmark-longitudinal-fuzzy.json
      - name: Build comparison tables
        run: python benchmarks/build_comparison_table.py
      - name: Confirm machine-readable output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").glob("benchmark-*.json")):
              data = json.loads(path.read_text())
              if path.name == "benchmark-summary.json":
                  assert data.get("schema_version") == 1
                  assert isinstance(data.get("benchmarks"), list)
                  print(path, "comparison-summary")
                  continue
              assert "benchmark" in data
              print(path, data["benchmark"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: long-gate-synthetic-benchmark-results
          path: |
            benchmark-*.json
            benchmark-summary.md
