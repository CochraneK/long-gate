name: security-audit
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Unit and privacy invariant tests
        run: pytest -q
      - name: Bandit
        run: bandit -q -r src
      - name: Dependency vulnerability audit
        run: pip-audit

  filesystem-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          path: .
          format: cyclonedx-json
          output-file: long-gate.sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: long-gate-sbom
          path: long-gate.sbom.json
