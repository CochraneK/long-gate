name: refresh-ci-lock

on:
  push:
    branches:
      - fix/ci-dev-lock
    paths:
      - pyproject.toml
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/ci-dev-lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate CI dependency lock
        run: |
          python -m pip install --upgrade uv
          uv pip compile pyproject.toml --extra dev --universal --generate-hashes -o requirements-ci.lock
      - name: Commit lockfile
        run: |
          if git diff --quiet -- requirements-ci.lock; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-ci.lock
          git commit -m "ci: add reproducible dependency lock"
          git push origin HEAD:fix/ci-dev-lock
