name: security-boundary
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Enforce privacy and capability boundaries
        run: |
          pytest -q \
            tests/test_policy.py \
            tests/test_pipeline.py \
            tests/test_agent_boundary.py \
            tests/test_approval.py \
            tests/test_deployment_contract.py \
            tests/test_egress.py \
            tests/test_model_vault.py \
            tests/test_hardware_advisor.py \
            tests/test_deidentify.py \
            tests/test_app.py
