name: one-shot-format

on:
  push:
    paths:
      - ".github/workflows/bootstrap-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.7"
      - name: Apply Ruff fixes
        run: |
          ruff check src tests benchmarks --fix
          ruff format src tests benchmarks
      - name: Commit fixes if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests benchmarks
          git commit -m "Apply Ruff auto-fixes"
          git push
