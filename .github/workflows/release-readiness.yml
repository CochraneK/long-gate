name: release-readiness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check release metadata
        run: python scripts/check_release.py
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-install wheel in clean environment
        run: |
          python -m venv /tmp/longgate-smoke
          source /tmp/longgate-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          longgate --help
          python -c "from longgate import LongGate, __version__; print(__version__); print(LongGate)"
          python -m pip check
