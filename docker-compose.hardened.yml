services:
  local-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ${LONGGATE_PRIVATE_DIR:?set LONGGATE_PRIVATE_DIR}:/private:ro
      - ${LONGGATE_RUN_DIR:-./longgate-runs}:/runs
      - ${LONGGATE_MODEL_VAULT_DIR:-./.longgate-models}:/models:ro
    environment:
      LONGGATE_MODEL_VAULT: /models
    tmpfs:
      - /tmp
    command:
      - longgate
      - run
      - /private/input.csv
      - --out
      - /runs
      - --backend
      - auto

  cloud-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.network
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ${LONGGATE_EGRESS_DIR:?set LONGGATE_EGRESS_DIR}:/safe:ro
      - ${LONGGATE_APPROVAL_LEDGER:?set LONGGATE_APPROVAL_LEDGER}:/policy/approvals.jsonl:ro
      - ${LONGGATE_ACCESS_DIR:-./longgate-access}:/access
    environment:
      LONGGATE_SAFE_WORKSPACE: /safe
      LONGGATE_APPROVAL_LEDGER: /policy/approvals.jsonl
      LONGGATE_ACCESS_LOG: /access/access.jsonl
    tmpfs:
      - /tmp

# Security invariant:
# - local-worker sees /private plus Model Vault:ro and has no network.
# - cloud-worker has network capability but sees /safe + read-only approvals only.
# - both privacy-boundary services drop Linux capabilities and deny privilege escalation.
# - artifact reads require relative path + SHA-256 + purpose approval.
# - approvals are generated by a local/admin action, never by the MCP surface.
# - never add LONGGATE_PRIVATE_DIR or /private to cloud-worker.
